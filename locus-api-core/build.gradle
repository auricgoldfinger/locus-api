// apply plugins
apply plugin: 'java'
apply plugin: "kotlin"
apply plugin: 'maven-publish'

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.21'

    // Logger
    api 'com.github.asamm:logger-asamm:2.2'
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

// Maven publisher
publishing {
    publications {
        maven(MavenPublication) {
            groupId 'com.asamm'
            artifactId 'locus-api-core'
            version API_VERSION
            from components.java
        }
    }
}
